<!DOCTYPE html>
<html>
<head>
    <title>Blind Test</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="icon" href="./electric-guitar.png" type="img/png">
    <script src="./js/submit.js"></script>
    <script src="./js/players.js"></script>
</head>
<body>
    <div class="game">
        <h2>Endless Blind Test</h2>
    
        <audio id="audio">
            <source id="audio_src" type="audio/mpeg">
        </audio>
        
        <div id="controls">
            <div id="countdown" hidden>10</div>
            <canvas width="200" height="200"></canvas>
            <img id="skip" src="res/skip-icon.png" hidden></img>
        </div>
        <div id="playing">Click Play</div>

        <br>
        <!--
            <button id=playbutton>Play</button>
        -->
        
        <div class="autocomplete">
            <input type="text" id="songinput" placeholder="Enter the song name...">
        </div>
        <div id="song"></div>
        <div id="result"></div>
    </div>
    <div class="playerpanel">
        <h3>Players</h3>
        <ul id="playerlist"></ul>
    </div>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        socket.on('connect', () => {
            socket.emit('join');
        });

        socket.on("session_id", (session_id)  => {
            document.cookie = `session_id=${session_id}; path=/;`;
        });
        
        socket.on("songlist", (songs) => {
            songList = songs;
        });
        
        socket.on('play', () => {
            updatePlayerList();
            playAudio();
        });
        
        socket.on('playerlist', (players) => {
            playerList = players;
            updatePlayerList();
        });
        
        socket.on('playerfinish', data => {
            const player = playerList.find(p => p.id === data.id);
            console.log(`Player ${player.username} finished in ${data.time} ms`);
            if (player) {
                player.finishTime = data.time;
                setPlayerFinishTime(player);
            }
        });
    </script>
    <script src="./js/play.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/canvas-anim.js"></script>
    <script src="js/redirect.js"></script>
    <script>
        document.getElementById('songinput').addEventListener('input', suggest);
        document.getElementById('songinput').addEventListener('keydown', select);
        /*document.getElementById('playbutton').addEventListener('click', () => {
            socket.emit('start');
        });*/

        audio.addEventListener('timeupdate', updateCountdown);
        audio.addEventListener('ended', timeUp);
        navigator.mediaSession.setActionHandler('pause', () => {});

        document.addEventListener('keydown', (event) => {
            if (event.keyCode === 13) {
                if (document.getElementById('songinput') === document.activeElement) {
                    return;
                }
                event.preventDefault();
                if (isController) {
                    document.querySelector("canvas").click();
                } else {
                    document.getElementById("skip").click();
                }
            }
        });
    </script>
</body>
</html>
